[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gpa-verify"
version = "1.5.0"
description = "Independent verifier for GetProofAnchor evidence bundles"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "GetProofAnchor", email = "support@getproofanchor.com" },
]
keywords = ["forensic", "evidence", "rfc3161", "eidas", "opentimestamps", "verification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving",
]
dependencies = [
    "asn1crypto>=1.5",
    "cryptography>=41.0",
]

# Optional extra: real Bitcoin block verification (--bitcoin-rpc). The core
# offline verifier needs none of this; install with `pip install gpa-verify[bitcoin]`
# only if you want to verify OTS receipts against your own Bitcoin node.
[project.optional-dependencies]
bitcoin = [
    "opentimestamps>=0.4",
]

[project.urls]
Homepage = "https://getproofanchor.com"
Repository = "https://github.com/getproofanchor/gpa-verify"
Issues = "https://github.com/getproofanchor/gpa-verify/issues"

[project.scripts]
gpa-verify = "gpa_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpa_verify"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
# Evidence-ZIP fixtures are large (tens of MB) real bundles used only by the
# test suite. They live in the git repo so `git clone && pytest` works, but
# they are excluded from the PyPI sdist to keep the published package small.
# CI and contributors run the full suite against the repo; the shipped sdist
# stays lean (verification code only).
exclude = [
    "/tests/fixtures/*.zip",
]
